# The Windows app on Windows: the Rust workspace (docs/windows-rust.md) — the engine, the signer, winsec linked into
# both — and its tests, then the installer. Windows Hello itself can't be tried here (a runner has no PIN or TPM for
# it); the tests that need its stand-in run off Windows only, and the real prompt is checked on a Windows machine.
# Runs on pushes to the `windows` branch only: the Mac app is built and released from a Mac (release.sh).
name: Windows

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: cargo test --locked --manifest-path Windows/rust/Cargo.toml

  # The installer, from the same commit: the engine and the signer in release, the window, NSIS.
  # Unsigned until the repository has a code-signing certificate (Windows/build.ps1 signs when WINDOWS_PFX is set).
  installer:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: ./Windows/build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ihatecrypto-windows-setup
          path: App/Windows/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
