# The Windows app's core on Windows: winsec.dll (Rust: Windows Hello, DPAPI, the signer's hardening), then the Swift
# core, the signer and the engine, and their tests. Windows Hello itself can't be tried here (a runner has no PIN or
# TPM for it); the vault's tests use the stand-in, and the real prompt is checked on a Windows machine.
# Runs on pushes to the `windows` branch only: the Mac app is built and released from a Mac (release.sh).
name: Windows core

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same compiler as Xcode on the Mac.
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          cache: true
      - name: winsec.dll
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path Windows/native/Cargo.toml
          # Rust names a DLL's import library winsec.dll.lib; Swift links -lwinsec.
          Copy-Item Windows/native/target/release/winsec.dll.lib Windows/native/target/release/winsec.lib
          "$PWD\Windows\native\target\release" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  # The installer, from the same commit: winsec.dll, the engine and the signer in release, the window, NSIS.
  # Unsigned until the repository has a code-signing certificate (Windows/build.ps1 signs when WINDOWS_PFX is set).
  installer:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          cache: true
      - name: Build
        shell: pwsh
        run: ./Windows/build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ihatecrypto-windows-setup
          path: App/Windows/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
