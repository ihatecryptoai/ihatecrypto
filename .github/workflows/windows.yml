# The Windows app on Windows: the Rust workspace (docs/windows-rust.md) — the engine, the signer, winsec linked into
# both — and its tests, then the installer. Windows Hello itself can't be tried here (a runner has no PIN or TPM for
# it); the tests that need its stand-in run off Windows only, and the real prompt is checked on a Windows machine.
# Runs on pushes to the `windows` branch only: the Mac app is built and released from a Mac (release.sh). The tests
# run on every push; the installer as its job says.
name: Windows

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

# A newer push stops the run of the one before it on the same branch: its result no longer matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every crate's tests even after one fails, so a run shows all that Windows breaks.
      - name: Test
        run: cargo test --locked --no-fail-fast --manifest-path Windows/rust/Cargo.toml

  # The installer, from the same commit: the engine and the signer in release, the window, NSIS.
  # Unsigned until the repository has a code-signing certificate (Windows/build.ps1 signs when WINDOWS_PFX is set).
  installer:
    needs: core
    # Three quarters of the run's minutes. The public repository's runs are free and a release takes its x64 installer
    # from there (docs/windows.md «A release»): built on every push. In the private one, whose minutes are paid, only
    # on Run workflow.
    if: github.repository == 'ihatecryptoai/ihatecrypto' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: ./Windows/build.ps1
      # The window's own tests (the engine's broker, the installer's container SID), once build.ps1 has put bin\ in place.
      - name: Test the window
        run: cargo test --locked --manifest-path Windows/app/src-tauri/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ihatecrypto-windows-setup
          path: App/Windows/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
