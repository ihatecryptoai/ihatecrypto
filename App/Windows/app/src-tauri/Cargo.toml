[package]
name = "ihatecrypto"
version = "0.9.0"
edition = "2024"
publish = false
description = "ihatecrypto for Windows: the window over the engine (ihatecrypto-engine) and the signer"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "unstable"] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-notification = "2.7.0"
serde_json = "1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Media_SpeechRecognition", "Win32_Foundation", "Win32_Globalization", "Win32_Media_Audio", "Win32_System_DataExchange",
  "Win32_System_Memory", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "UI_Notifications"] }
# The engine's AppContainer, the signer's hardened start, a Ledger's handle (broker.rs): the library the engine and the signer link.
winsec = { path = "../../native" }
# WebView2's own history, load errors and process failures (web.rs); the version wry uses.
webview2-com = "0.39.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
