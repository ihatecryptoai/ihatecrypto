[package]
name = "ihatecrypto"
version = "0.1.0"
edition = "2024"
publish = false
description = "ihatecrypto for Windows: the window over the engine (ihatecrypto-engine) and the signer"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-notification = "2.7.0"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Media_SpeechRecognition", "Win32_Foundation", "Win32_Globalization", "Win32_System_DataExchange",
  "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
