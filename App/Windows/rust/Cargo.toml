# ihatecrypto for Windows, rewritten in Rust step by step (docs/windows-rust.md): each crate takes the place of a
# Swift module under App/Sources and passes the same test vectors before anything uses it.
[workspace]
resolver = "3"
members = ["wallet", "hyperliquid", "solana", "evm", "signer-api", "guard", "signer", "net", "llm", "protocols", "ihatecrypto-core", "execution", "defi", "engine", "ledger", "trade"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
k256 = { version = "0.13.4", features = ["ecdsa"] }
# P-256 for Intel TDX quotes and their certificates (llm's NEAR AI check): pure Rust, no C toolchain on ARM64.
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
ed25519-dalek = "2.2"
curve25519-dalek = "4.1"
sha2 = "0.10.9"
sha3 = "0.10.8"
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1.8"
getrandom = "0.3"
rust_decimal = "1.39"
ruint = "1.12"
aes-gcm = "0.10"
hkdf = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
evm = { path = "evm" }
signer-api = { path = "signer-api" }
guard = { path = "guard" }
execution = { path = "execution" }
net = { path = "net" }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "gzip"] }
wallet = { path = "wallet" }
hyperliquid = { path = "hyperliquid" }
solana = { path = "solana" }

[profile.release]
panic = "abort"
lto = true
