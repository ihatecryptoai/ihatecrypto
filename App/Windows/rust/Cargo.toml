# ihatecrypto for Windows, rewritten in Rust step by step (docs/windows-rust.md): each crate takes the place of a
# Swift module under App/Sources and passes the same test vectors before anything uses it.
[workspace]
resolver = "3"
members = ["wallet", "hyperliquid", "solana", "evm", "signer-api", "guard"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
k256 = { version = "0.13.4", features = ["ecdsa"] }
ed25519-dalek = "2.2"
curve25519-dalek = "4.1"
sha2 = "0.10.9"
sha3 = "0.10.8"
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1.8"
getrandom = "0.3"
rust_decimal = "1.39"
ruint = "1.12"
wallet = { path = "wallet" }
hyperliquid = { path = "hyperliquid" }
solana = { path = "solana" }

[profile.release]
panic = "abort"
lto = true
