[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "ihatecrypto's engine for Windows: the Rust port of App/Sources/Desktop/Engine, built up from its leaves (the platform calls, the link to the signer)"

[dependencies]
signer-api.workspace = true
execution.workspace = true
evm.workspace = true
hyperliquid.workspace = true
wallet.workspace = true
serde_json.workspace = true
