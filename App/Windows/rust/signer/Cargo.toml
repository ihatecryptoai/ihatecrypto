[package]
name = "signer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "ihatecrypto's signing process for Windows: the Rust port of App/Sources/Signer (Core, Windows)"

[[bin]]
name = "ihatecrypto-signer"
path = "src/main.rs"

[dependencies]
wallet.workspace = true
hyperliquid.workspace = true
solana.workspace = true
evm.workspace = true
guard.workspace = true
signer-api.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
zeroize.workspace = true
getrandom.workspace = true
ed25519-dalek.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
base64.workspace = true

# Windows Hello, DPAPI and the process's hardening: winsec as a Rust library here, not a DLL.
[target.'cfg(windows)'.dependencies]
winsec = { path = "../../native" }

[dev-dependencies]
base64.workspace = true
