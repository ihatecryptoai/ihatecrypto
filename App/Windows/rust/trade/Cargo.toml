description = "Runs an approved plan: the Rust port of App/Sources/Execution/Trade (the executor, its bridges, swaps, sends, loans and reads)"

[dependencies]
execution.workspace = true
evm.workspace = true
guard.workspace = true
hyperliquid.workspace = true
net.workspace = true
