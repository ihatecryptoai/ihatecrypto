# ihatecrypto.app with its signing process. `xcodegen` here, then build with xcodebuild (see ../build-app.sh).
# The SwiftPM package one level up stays the source of the modules; this project only packages and signs.
name: ihatecrypto
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  ihatecrypto:
    path: ..
  # Updates for the copy downloaded from the site (release.sh). An App Store build must leave it out.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # The same exact version as Package.swift: both write App/Package.resolved, and differing pins would flip it.
    exactVersion: 2.10.1
settings:
  configs:
    # Release is what runs with real money: no get-task-allow, so nothing — not even root with SIP on — can attach a
    # debugger to the app or the signer and read the seed from memory. Debug keeps it for Xcode and xctrace.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  base:
    DEVELOPMENT_TEAM: N78L833HCS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Which copy: these two are the working one, the release (release.sh). build-app.sh passes «ihatecrypto Dev» and
    # app.ihatecrypto.mac.dev: the development copy beside it, with a Keychain group, settings, data folder, debug port
    # and Keep running agent of its own (`Flavor`), so a build from this tree never touches the working one's.
    APP_NAME: ihatecrypto
    APP_ID: app.ihatecrypto.mac
    # The local debug API (DebugAPI.swift): build-app.sh sets DEBUG_API for the copies it makes; a release has none.
    DEBUG_API_CONDITION: ""
    # Written into Info.plist by Tools/build-release.sh, so verify-release.sh knows which XcodeGen made a release.
    XCODEGEN_VERSION: ""
    # The script below edits the built Info.plist, which a sandboxed script phase may not do.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ihatecrypto:
    type: application
    platform: macOS
    sources: [../Sources/IhatecryptoApp]
    # ihatecrypto.app, app.ihatecrypto.mac: its name in the Dock, menu bar, notifications and Touch ID.
    dependencies:
      - package: ihatecrypto
        product: IhatecryptoKit
      - package: Sparkle
      - target: IhatecryptoSigner
      - target: IhatecryptoHelper
    # Xcode writes the build Mac's macOS build into Info.plist; without it a release rebuilds byte for byte on any Mac
    # with the same Xcode (verify-release.sh). The phase runs before code signing, after Xcode writes the file.
    postBuildScripts:
      - name: Info.plist without the build Mac's macOS
        script: /usr/libexec/PlistBuddy -c "Delete :BuildMachineOSBuild" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
        # The written Info.plist as an input: the phase runs after Xcode writes it (without it, on GitHub's Mac it ran first).
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        basedOnDependencyAnalysis: false
      # The App Sandbox's two files, named for this copy. Keep running's launch agent (KeepRunning in Tasks.swift),
      # registered with SMAppService: this app's own binary at login and every minute. And the container migration:
      # on the first sandboxed launch macOS moves this copy's data folder (Flavor.folder), settings and web data into
      # its container, so an update from a copy before the sandbox keeps its chats, canvases and settings. The dApp
      # browser's data has another place in a container: WebKit/WebsiteData, not WebKit/<bundle id>/WebsiteData.
      - name: Launch agent and container migration
        script: |
          agents="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$agents"
          cat > "$agents/$PRODUCT_BUNDLE_IDENTIFIER.agent.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>Label</key><string>$PRODUCT_BUNDLE_IDENTIFIER.agent</string>
          <key>BundleProgram</key><string>Contents/MacOS/$EXECUTABLE_NAME</string>
          <key>ProgramArguments</key><array><string>$EXECUTABLE_NAME</string><string>--keep-running-check</string></array>
          <key>RunAtLoad</key><true/>
          <key>StartInterval</key><integer>60</integer>
          <key>ProcessType</key><string>Background</string>
          <key>AssociatedBundleIdentifiers</key><array><string>$PRODUCT_BUNDLE_IDENTIFIER</string></array>
          </dict></plist>
          EOF
          case $PRODUCT_BUNDLE_IDENTIFIER in app.ihatecrypto.mac) folder=ihatecrypto;; app.ihatecrypto.mac.metal) folder=ihatecrypto-metal;; *) folder=ihatecrypto-dev;; esac
          cat > "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/container-migration.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>Move</key><array>
          <string>\${ApplicationSupport}/$folder</string>
          <string>\${Library}/Preferences/\${BundleId}.plist</string>
          <array><string>\${Library}/WebKit/\${BundleId}/WebsiteData</string><string>\${Library}/WebKit/WebsiteData</string></array>
          <string>\${Library}/HTTPStorages/\${BundleId}</string>
          <string>\${Library}/HTTPStorages/\${BundleId}.binarycookies</string>
          </array></dict></plist>
          EOF
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        PRODUCT_NAME: $(APP_NAME)
        # The module keeps its name whatever the copy is called.
        PRODUCT_MODULE_NAME: ihatecrypto
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(DEBUG_API_CONDITION)
        # Sparkle's keys, merged into the generated plist. The feed is empty in a local build (no update checks);
        # release.sh passes the site's appcast.
        INFOPLIST_FILE: ihatecrypto-Info.plist
        SPARKLE_FEED_URL: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        # In the App Sandbox (the file says what each entitlement is for); the signer and the helper are its XPC services.
        CODE_SIGN_ENTITLEMENTS: ihatecrypto.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "After you click the chat's microphone, ihatecrypto listens and types what you say into the field. Nothing is sent until you send it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "What you say in the chat becomes text in its field, recognized on this Mac when your language's model is installed."
        # A Ledger Nano X, Stax or Flex over Bluetooth (Sources/Wallet/Ledger/BLE.swift).
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "ihatecrypto talks to your Ledger over Bluetooth to read its addresses and ask it to sign. Every signature is approved on the Ledger itself."
  # Sandboxed, no network entitlement: it can only answer the app over XPC and read its own Keychain group.
  # Its Touch ID prompt names it and shows its icon: «ihatecrypto is trying to send 0.18 USDC to 0x060b…9Ff0 on Tempo»
  # with the coin, not «Signer» with a blank bundle's icon. The module keeps a name of its own: «Signer» is its main type.
  IhatecryptoSigner:
    type: xpc-service
    platform: macOS
    sources: [../Sources/Signer/Service, ../Sources/IhatecryptoApp/Assets.xcassets]
    info:
      path: Signer-Info.plist
      properties:
        # xcodegen writes this plist from here: the name the Touch ID window shows goes here, not in the file.
        CFBundleName: $(APP_NAME)
        CFBundleDisplayName: $(APP_NAME)
        XPCService:
          ServiceType: Application
    dependencies:
      - package: ihatecrypto
        product: IhatecryptoSignerKit
    postBuildScripts:
      - name: Info.plist without the build Mac's macOS
        script: /usr/libexec/PlistBuddy -c "Delete :BuildMachineOSBuild" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
        # The written Info.plist as an input: the phase runs after Xcode writes it (without it, on GitHub's Mac it ran first).
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).signer
        PRODUCT_NAME: Signer
        PRODUCT_MODULE_NAME: IhatecryptoSigner
        # The generated plist would put CFBundleName = PRODUCT_NAME over the file's «ihatecrypto».
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Signer.entitlements
        ENABLE_APP_SANDBOX: YES
        # No get-task-allow in any configuration: a Debug signer shares the Release Keychain group, so a debugger attached
        # to it could read the address book, approved addresses and opened keys. Only the app stays debuggable.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  # Outside the App Sandbox, no entitlements: what the sandboxed app can't do itself, each thing fixed in its code
  # (Sources/Helper: run Claude Code with no tools, install it, open its sign-in, remove the pre-sandbox Keep running
  # agent). It takes only the app it's built into as a caller, checked by code signature like the signer.
  IhatecryptoHelper:
    type: xpc-service
    platform: macOS
    sources: [../Sources/Helper/Service]
    info:
      path: Helper-Info.plist
      properties:
        # Without it launchd doesn't take the bundle as the app's service («failed lookup … No such process»). In the
        # app's security session: Claude Code reads its login from the user's Keychain, which a new session can't open
        # («Not logged in», CSSMERR_CSP_NO_USER_INTERACTION).
        XPCService:
          ServiceType: Application
          JoinExistingSession: true
    dependencies:
      - package: ihatecrypto
        product: IhatecryptoHelperKit
    postBuildScripts:
      - name: Info.plist without the build Mac's macOS
        script: /usr/libexec/PlistBuddy -c "Delete :BuildMachineOSBuild" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).helper
        PRODUCT_NAME: Helper
        PRODUCT_MODULE_NAME: IhatecryptoHelper
        GENERATE_INFOPLIST_FILE: NO
